[build-system]
requires = ["setuptools>=77"]  # 77 起支持 license = "SPDX 表达式" 与 license-files
build-backend = "setuptools.build_meta"

[project]
name = "heng-agent"
version = "0.5.0"
description = "中文优先的终端编码智能体：读代码、改代码、跑命令；支持 DeepSeek、Kimi、通义、GLM、Claude 等，兼容 Claude Code 配置"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "抓蛙师" }]
keywords = ["ai", "agent", "coding-agent", "cli", "claude-code", "deepseek", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27", # 流式调用模型（Anthropic Messages 协议）；[socks]：代理可以写 socks5://
    "rich>=13",           # 终端渲染：Markdown、代码高亮、改动对比
    "prompt_toolkit>=3.0", # 输入框：多行、历史、斜杠命令补全
    "pydantic>=2.6",      # 配置与消息的严格校验
    "pillow>=10",         # 图片缩略图（Sixel 终端内预览）
    "agent-client-protocol>=0.12.1,<0.13",  # ACP（--acp 模式）：0.x 次版本可能不兼容，测过再升
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
heng-agent = "heng_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# setuptools 默认只打包 .py：内置提示词（/commit、/review）不声明就不会进安装包，装好后找不到文件、启动就崩
# 内置技能同理：skills/<名字>/SKILL.md
heng_agent = ["prompts/*.md", "skills/*/*.md"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 中文标点在注释与字符串里是正常的

[tool.ruff.lint.per-file-ignores]
# 工具的 input_schema 是类级常量字典（基类已声明 ClassVar，只读不改），子类逐个再标 ClassVar 只是噪音
"src/heng_agent/tools/*.py" = ["RUF012"]
# 录好的 SSE 事件一行一个更好对照协议文档
"tests/test_model_client.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
