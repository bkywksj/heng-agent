# 在 Windows / macOS / Linux 与 Python 3.11 / 3.13 上跑代码检查与全部测试。本地只在 Windows 上测，别的平台靠它发现问题。
#
# 不在推送分支时自动跑：每次 6 个任务，macOS 分钟数按 10 倍算，Actions 配额经不起每推一次就跑一遍。
# 发布（release.yml，推 v 标签）前会跑同一套测试，所以平时只在两种情况下跑：
# - 手动触发（发版前想先验证：GitHub 网页的 Actions → CI → Run workflow，或 Sigil 的 github_workflow_dispatch）；
# - 别人提合并请求（我们自己推分支不会触发）。
name: CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 一个平台挂了不影响看其他平台的结果
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: 装依赖
        run: uv sync --extra dev  # pytest、ruff 在可选依赖 dev 里，不加 --extra 不会装
      - name: 代码检查
        run: |
          uv run ruff format --check src tests
          uv run ruff check src tests
      - name: 测试
        shell: bash  # 各平台用同一种 shell，下面的写法才一致
        timeout-minutes: 15  # 有测试卡住（如等键盘输入）时别一直挂着
        # 失败时把每个失败的测试写成 GitHub 注释：网页上直接看得到原因，也能用 API 读（完整日志要管理员权限下载）。
        # 报告里找不到具体哪个测试（收集阶段出错、进程崩溃）时，把 pytest 输出的末尾写成注释
        run: |
          set +e
          uv run python -m pytest -q -rf --junitxml=report.xml 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            uv run python scripts/ci_annotate.py report.xml pytest.log
          fi
          exit "$status"
      - name: 构建安装包并检查内容
        shell: bash
        run: |
          uv build --wheel
          uv run python -c "import zipfile, glob; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); prompts = [n for n in names if n.endswith('.md') and '/prompts/' in n]; assert prompts, '安装包里没有内置提示词'; skills = [n for n in names if '/skills/' in n and n.endswith('SKILL.md')]; assert skills, '安装包里没有内置技能'; print('内置提示词：', prompts); print('内置技能：', skills)"
